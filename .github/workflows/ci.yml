# Checks every push and pull request: the UI must type-check and web/dist must be current.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # web/dist is committed (node-poc/build.sh embeds it); it must match the sources
      - name: web/dist is up to date
        run: |
          if ! git diff --quiet -- web/dist || [ -n "$(git ls-files --others --exclude-standard web/dist)" ]; then
            git status --short web/dist
            echo "web/dist is stale: run 'cd web && npm install && npm run build' and commit it"; exit 1
          fi
